name: Sync upstream release

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'araujo-fernando/llama.cpp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge latest upstream release tag
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/ggml-org/llama.cpp.git
          tag=$(git ls-remote --tags --refs upstream 'b*' | sed -n 's@.*refs/tags/\(b[0-9][0-9]*\)$@\1@p' | sort -V | tail -n 1)
          test -n "$tag"
          git fetch --no-tags upstream "refs/tags/$tag:refs/tags/$tag"
          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "Already contains $tag"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit --no-ff "$tag"
          git push origin HEAD:master
